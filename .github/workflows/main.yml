name: Build plugin

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Maven cache that survives a version bump in pom.xml (falls back to the newest older cache), so a
      # dependency repository that is down for a while (e.g. PlaceholderAPI's) doesn't break the build
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-
            setup-java-Linux-x64-maven-

      - name: Build plugin
        run: mvn -B clean package 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Show why the build failed
        if: failure()
        shell: bash
        run: |
          # compile errors and failed tests as annotations (readable without downloading the log)
          grep -E '^\[ERROR\]' build.log | grep -v 'Re-run Maven\|For more information\|Help 1\|^\[ERROR\] *$\|-> \[Help' | head -30 \
            | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -E 'FAILURE|expected|Exception|Error' "$f" | head -10 | while IFS= read -r line; do echo "::error::$(basename "$f"): ${line//%/%25}"; done
          done
          true

      - name: Start a real Paper server with the plugin
        run: bash .github/smoke-test.sh

      - name: Zip resource pack
        shell: bash
        run: |
          set -euo pipefail
          # find the folder that holds pack.mcmeta AND assets/ (wherever it is in the repo)
          PACK_DIR=""
          while IFS= read -r meta; do
            dir=$(dirname "$meta")
            if [ -d "$dir/assets" ]; then PACK_DIR="$dir"; break; fi
          done < <(find . -path ./target -prune -o -path ./.git -prune -o -name pack.mcmeta -print | sort)
          if [ -z "$PACK_DIR" ]; then
            echo "::error::No folder with both pack.mcmeta and assets/ found in the repository"
            find . -path ./.git -prune -o -maxdepth 3 -print
            exit 1
          fi
          echo "Resource pack folder: $PACK_DIR"

          # fixed timestamps + sorted order = the same SHA1 as long as the pack doesn't change
          find "$PACK_DIR" -exec touch -h -t 202001010000 {} +
          mkdir -p target
          OUT="$PWD/target/Forgebound-pack.zip"
          rm -f "$OUT"
          (cd "$PACK_DIR" && find . -type f ! -name '.*' | sed 's|^\./||' | sort | zip -X -D "$OUT" -@)

          LIST=$(unzip -Z1 "$OUT")
          COUNT=$(printf '%s\n' "$LIST" | wc -l)
          echo "Files in the pack: $COUNT"
          printf '%s\n' "$LIST" | cut -d/ -f1-2 | sort -u
          if [ "$COUNT" -lt 20 ] || [[ "$LIST" != *"assets/customcraft/"* ]]; then
            echo "::error::The resource pack zip looks incomplete ($COUNT files)"
            exit 1
          fi

          echo "PACK_SHA1=$(sha1sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "VERSION=$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forgebound-${{ env.VERSION }}
          path: |
            target/Forgebound.jar
            target/Forgebound-pack.zip

      - name: Pick the release tag
        shell: bash
        run: |
          # Releases are immutable on this repo: a tag can never be reused, even after deleting the release.
          # So every build gets its own tag; the newest one is always marked as "Latest".
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v${VERSION}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Write release notes
        run: |
          cat > notes.md <<NOTES
          **Forgebound ${VERSION}** for Paper 1.21.11 (Java 21)

          - \`Forgebound.jar\` - put it into \`plugins/\`
          - \`Forgebound-pack.zip\` - the resource pack

          For \`server.properties\` (this link always points to the newest release):
          \`\`\`
          resource-pack=https://github.com/Freonik/Forgebound-releases/releases/latest/download/Forgebound-pack.zip
          resource-pack-sha1=${PACK_SHA1}
          \`\`\`
          Only the SHA1 changes when the textures change.

          Built from commit ${GITHUB_SHA::7}.
          NOTES

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TITLE="Forgebound $RELEASE_TAG"
            EXTRA="--generate-notes"
          else
            TITLE="Forgebound ${VERSION} (build ${GITHUB_RUN_NUMBER})"
            EXTRA="--target $GITHUB_SHA"
          fi
          gh release create "$RELEASE_TAG" target/Forgebound.jar target/Forgebound-pack.zip \
            --title "$TITLE" \
            --notes-file notes.md \
            --latest \
            $EXTRA

      - name: Publish to Forgebound-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: bash .github/publish-releases.sh Forgebound forgebound "Forgebound ${VERSION} (build ${GITHUB_RUN_NUMBER})" true target/Forgebound.jar target/Forgebound-pack.zip
