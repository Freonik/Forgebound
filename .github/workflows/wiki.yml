name: Wiki

# Builds the wiki from config.yml + the resource pack textures and puts it on the gh-pages branch
# of the public Forgebound-releases repository (its GitHub Pages: Deploy from a branch -> gh-pages / root).
# Needs the RELEASES_TOKEN secret (contents: write on Forgebound-releases).
on:
  push:
    branches: [ main ]
    paths: [ 'site/**', 'src/main/resources/config.yml', 'resourcepack/**', 'docs/**', 'pom.xml', '.github/workflows/wiki.yml' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pillow
      - run: python site/build.py _site
      - name: Publish to the gh-pages branch
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Wiki for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${RELEASES_TOKEN}@github.com/Freonik/Forgebound-releases.git" gh-pages
