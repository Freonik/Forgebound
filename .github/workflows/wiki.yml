name: Wiki

# Builds the full wiki (everything, no sneak peek) from config.yml + the resource pack textures and puts it
# on this repository's own gh-pages branch (GitHub Pages: Deploy from a branch -> gh-pages / root).
on:
  push:
    branches: [ main ]
    paths: [ 'site/**', 'src/main/resources/config.yml', 'resourcepack/**', 'docs/**', 'pom.xml', '.github/workflows/wiki.yml' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pillow
      - run: WIKI_FULL=1 python site/build.py _full
      - name: Publish the full wiki to this repository's gh-pages branch
        run: |
          cd _full
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Full wiki for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
