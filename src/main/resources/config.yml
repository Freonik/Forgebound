# ------------------------------------------------------------
#  FORGE RITUAL (weapons)
#  Clicking FORGE on a weapon takes the materials and starts a ritual on
#  the crafting table. The table can't be broken, blown up or moved while
#  it runs. When it ends, the weapon drops on the table.
#  The timer only runs while the server is online (it survives restarts).
#  Per weapon you can override the length with "ritual-minutes: 30".
# ------------------------------------------------------------
ritual:
  enabled: true
  duration-minutes: 15
  # Who sees the ritual boss bar: ALL, NEARBY or NONE
  bossbar: ALL
  bossbar-radius: 64
  # Show the forger's name? If false, everyone sees hidden-player-name instead
  # (also in the forge menu). The weapon itself is always shown.
  show-player: false
  hidden-player-name: "Someone"
  # Show the location at all (chat + boss bar). false = never show it.
  show-coordinates: true
  # A ritual can only start with at least this many players online (0 = no limit),
  # so nobody forges a legend alone at 3 am.
  min-players: 3
  # If players leave during a ritual and fewer than min-players are online, the timer pauses.
  pause-below-min-players: true
  # Reveal the location step by step during the ritual (chat announcement + boss bar).
  # at-percent: how far into the ritual (0-100). radius: -1 = only the dimension,
  # n = an area of ±n blocks (randomly shifted, so its centre isn't the table), 0 = exact coordinates.
  # For a 15 minute ritual: 0 min, 5 min, 10 min and 13 min.
  location-reveal:
    enabled: true
    stages:
      - { at-percent: 0, radius: -1 }
      - { at-percent: 33, radius: 500 }
      - { at-percent: 66, radius: 100 }
      - { at-percent: 87, radius: 0 }

# ------------------------------------------------------------
#  UNIQUE WEAPONS AND RELICS
#  Each weapon and relic can exist only once on the server. Once its ritual
#  starts, nobody else can make it.
#  Set "unique: false" on a weapon or relic to exclude it.
#  Admins: /forge status, /forge release <id>
#  (/forge give ignores this, it's an admin tool)
# ------------------------------------------------------------
unique-weapons:
  enabled: true
  # If the weapon is destroyed as a dropped item (lava, fire, cactus, void,
  # despawn), it becomes forgeable again
  release-when-destroyed: true

# ------------------------------------------------------------
#  WEAPON ABILITIES - global settings
# ------------------------------------------------------------
ability-settings:
  enabled: true
  # Cooldowns in the action bar while holding a weapon with abilities
  hud: true
  # Can abilities hurt players? (PvP disabled in a world/region is always respected)
  damage-players: true
  # Damage multiplier for abilities against players (0.5 = half)
  pvp-multiplier: 1.0
  # Worlds where abilities don't work (e.g. spawn / lobby)
  disabled-worlds: []
  # Mobs that Devour (Abyssal Maw) can never swallow (the Wither and the Ender Dragon never can)
  devour-immune: [WARDEN, ELDER_GUARDIAN, RAVAGER, GHAST, HAPPY_GHAST, IRON_GOLEM, SNIFFER]

# ------------------------------------------------------------
#  WEAPONS
#  attack-damage / attack-speed are TOTAL values (as in the tooltip).
#  Vanilla sword: damage 7-9, speed 1.6; axe: speed 0.9-1.1
#  Enchant names: minecraft keys in lower case (sharpness, power, ...)
#
#  abilities:
#    passive:   potion effects while the weapon is held in the main hand
#               effects: { effect_name: level-1 }   (0 = level I)
#               low-health-regen: { below-percent: 30, percent-per-second: 1.5 }
#               ore-double-chance: 20   (tools: % chance a mined ore drops twice)
#    on-hit:    effects on hit (charged melee hit, or an arrow from this bow)
#               types: ECHO, CRUSH, RICOCHET, SOUL, LIFESTEAL, CLEAVE, BLUNT_FORCE, TASTE, SILK_BIND, TIDE, CLOAK
#               (on-hit entries can also have unlock-kills)
#    active:    abilities with a cooldown (seconds)
#               trigger: RIGHT_CLICK, SHIFT_RIGHT_CLICK, SWAP (F key), SHIFT_SWAP
#               types: REWIND, RESONANCE, GRAVITY_ANCHOR, UPHEAVAL,
#                      MIRROR_SHOT, HEX_MARK, SOUL_LINK, HARVEST, CRESCENT, FRENZY,
#                      CLEAVER_TOSS, BLOODRUSH, TONGUE_LASH, DEVOUR,
#                      CLAWLINE, DIVE, SILK_DART, THREAD_STORM, GRAPPLE, HAMMER_THROW,
#                      AXE_THROW, FROST_WAVE, PIN_BOLT, VOLLEY, LUNGE, JAVELIN, TIDAL_SURGE, GREAT_TIDE
#               charges: 3        -> usable 3 times before the cooldown starts
#               unlock-kills: 10  -> locked until the weapon has this many kills (needs "kills:")
#    kills:     { enabled: true, count-mobs: false } -> the weapon counts its kills (stored on the item);
#               passive "unlock-kills" works the same way
#    enchant-unlocks: { wind_burst: 2 } -> that enchantment can only be added after 2 kills
#  "max HP" scaling: Cleaver Toss, Bloodrush, Tongue Lash and Devour grow with your
#  MAX health, so they pair well with Heartsteel Core and Health Boost.
#    arrow-trail: particle behind arrows (bows only), e.g. WITCH
#  The ability list is added to the item lore automatically.
#  To remove a default on-hit list, write: on-hit: []
# ------------------------------------------------------------
weapons:
  echo_blade:
    material: NETHERITE_SWORD
    name: "&3&lEcho Blade"
    lore:
      - "&7Every strike rings twice."
    custom-model-data: 1001
    unbreakable: true
    attack-damage: 9
    attack-speed: 1.6
    enchants:
      sharpness: 5
    abilities:
      on-hit:
        - type: ECHO
          chance: 100
          percent: 40
          delay-ticks: 30
          description: ["Echo: 1.5s later the hit repeats", "for 40% of its damage."]
      active:
        rewind:
          type: REWIND
          name: "&3Rewind"
          trigger: SWAP
          cooldown: 30
          description: ["Snap back to where you stood 4s ago", "and regain the health you had then."]
          seconds: 4
        resonance:
          type: RESONANCE
          name: "&b&lResonance"
          trigger: SHIFT_SWAP
          cooldown: 40
          description: ["Everyone you hurt in the last 10s", "takes 50% of that damage again (max 14)."]
          radius: 12
          percent: 50
          window: 10
          max-damage: 14
    forge:
      - { item: NETHERITE_SWORD, amount: 1 }
      - { item: ECHO_SHARD, amount: 8 }
      - { item: SCULK_CATALYST, amount: 4 }
      - { item: AMETHYST_SHARD, amount: 32 }
      - { item: "material:resonant_shard", amount: 1 }

  graviton_hammer:
    material: DIAMOND_AXE
    name: "&5&lGraviton Hammer"
    lore:
      - "&7Heavier than it has any right to be."
    custom-model-data: 1002
    unbreakable: true
    attack-damage: 12
    attack-speed: 0.9
    enchants:
      sharpness: 5
      efficiency: 5
    abilities:
      passive:
        effects: { resistance: 0 }
        description: "Resistance I"
      on-hit:
        - type: CRUSH
          chance: 100
          damage-per-block: 1.5
          max-bonus: 8
          # falling onto the target (like a mace): +1 per block fallen, max +20.
          # Hitting while still in the air cancels your fall damage.
          fall-damage-per-block: 1.0
          max-fall-bonus: 20
          landing-window-ms: 700
          slam: 1.6
          slow-ticks: 30
          description: ["Crushing Weight: fall onto the target for", "+1 dmg per block fallen (max +20) - a", "mid-air hit cancels your fall damage.", "Standing above it: +1.5 per block (max +8).", "Airborne targets get slammed down."]
      active:
        anchor:
          type: GRAVITY_ANCHOR
          name: "&5Gravity Anchor"
          trigger: SWAP
          cooldown: 35
          description: ["Drop a 7-block gravity field for 6s.", "Enemies inside are slowed and", "yanked back if they try to leave."]
          radius: 7
          duration: 6
          pull: 0.5
          slow-level: 2
        upheaval:
          type: UPHEAVAL
          name: "&d&lUpheaval"
          trigger: SHIFT_SWAP
          cooldown: 45
          description: ["Lift every enemy around you into the air,", "then slam them down. The higher they", "are, the harder they hit (max 12)."]
          radius: 6
          lift-ticks: 25
          base-damage: 4
          damage-per-block: 1
          max-damage: 12
    forge:
      - { item: DIAMOND_AXE, amount: 1 }
      - { item: HEAVY_CORE, amount: 1 }
      - { item: OBSIDIAN, amount: 32 }
      - { item: IRON_BLOCK, amount: 16 }
      - { item: "material:graviton_core", amount: 1 }

  hex_bow:
    material: BOW
    name: "&2&lHexbow"
    lore:
      - "&7Strung with something that still twitches."
    custom-model-data: 1003
    unbreakable: true
    enchants:
      power: 5
      infinity: 1
    abilities:
      passive:
        effects: { speed: 0 }
        description: "Speed I"
      arrow-trail: WITCH
      on-hit:
        - type: RICOCHET
          chance: 40
          percent: 60
          range: 8
          description: ["Ricochet: the hex jumps to the nearest", "other enemy for 60% damage."]
      active:
        mirror:
          type: MIRROR_SHOT
