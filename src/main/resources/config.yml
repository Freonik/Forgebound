    angels_wings: true
    thorn_plate: true
    heartsteel_core: true
    thick_hide: true
    soul_vessel_mask: true
    stitchguard: true
    hide_cowl: true
    hide_mantle: true
    hide_stompers: true
    seraph_mantle: true
    seraph_greaves: true
    heartsteel_helm: true
    heartsteel_greaves: true
    heartsteel_treads: true
    thorn_crown: true
    thorn_greaves: true
    thorn_treads: true
  materials:
    resonant_shard: true
    graviton_core: true
    hexed_thread: true
    soul_ember: true
