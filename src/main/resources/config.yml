          trigger: SWAP
          cooldown: 20
          description: ["Snap back to where you stood 5s ago", "and regain the health you had then."]
          seconds: 5
        resonance:
          type: RESONANCE
          name: "&e&lColossal Resonance"
          trigger: SHIFT_SWAP
          cooldown: 30
          description: ["Everyone you hurt in the last 10s", "takes 70% of that damage again (max 20)."]
          radius: 16
          percent: 70
          window: 10
          max-damage: 20

# ------------------------------------------------------------
#  LEGENDS
#  Every forged weapon / relic copy has a hidden serial number, so only the real copy works.
#  If the last player who carried a legend hasn't been online for "inactive-days",
#  the legend returns to the forge (can be forged again) and the old copy crumbles to dust.
#  0 = never. /legends shows all legends and your own stats with them.
# ------------------------------------------------------------
legends:
  inactive-days: 7
  title: "&8Legends"

# A small finisher effect when a legendary weapon gets a kill
kill-effects: true

# ------------------------------------------------------------
#  BOUNTIES
#  Carrying a legendary weapon or relic slowly raises your bounty (+1 token every
#  "minutes-per-token" minutes, up to "max-tokens"). Whoever kills you gets your bounty
#  as Bounty Tokens. Spend them with /bounty (or right-click a token).
# ------------------------------------------------------------
bounty:
  enabled: true
  minutes-per-token: 10
  max-tokens: 20
  # Bounties that are announced in chat
  announce-at: [5, 10, 20]
  # The same killer can't claim the same victim's bounty again for this long
  same-target-cooldown-minutes: 30
  # Legend Tracker: points near (± tracker-offset blocks) the closest legend holder
  tracker-update-seconds: 30
  tracker-offset: 50
  # Prices in Bounty Tokens
  exchange:
    tracker: 3
    random-material: 4
    chosen-material: 10

# ------------------------------------------------------------
#  TOKEN ECONOMY
#  Bounty Tokens as a currency: /shop (fixed offers + a weekly rotating offer)
#  and /pay <player> <amount>. Tokens also come from the Forge Warden and meteor caches.
#  enabled: false turns all of it off (no /shop, no /pay, no tokens from the Warden
#  or meteors). Bounties and the Bounty Exchange keep working, see "bounty".
# ------------------------------------------------------------
economy:
  enabled: true
  # Allow /pay
  pay: true
  rewards:
    warden-tokens: 10
    meteor-tokens-min: 2
    meteor-tokens-max: 5
  shop:
    title: "&8Token Shop"
    # How often the rotating offer changes, and how many of the "rotating" items are in it (max 7)
    rotation-days: 7
    rotating-count: 5
    # material, amount (per purchase), price (tokens), limit (purchases per player per week, 0 = no limit).
    # Add "enabled: false" to an offer to hide it. Max 14 permanent offers.
    permanent:
      diamond: { material: DIAMOND, amount: 2, price: 3 }
      golden_apple: { material: GOLDEN_APPLE, amount: 2, price: 2 }
      netherite_scrap: { material: NETHERITE_SCRAP, amount: 1, price: 6 }
      experience_bottle: { material: EXPERIENCE_BOTTLE, amount: 16, price: 2 }
      ender_pearl: { material: ENDER_PEARL, amount: 8, price: 2 }
      golden_carrot: { material: GOLDEN_CARROT, amount: 32, price: 1 }
      recon_spyglass: { material: recon_spyglass, amount: 1, price: 6 }
    rotating:
      netherite_ingot: { material: NETHERITE_INGOT, amount: 1, price: 20, limit: 1 }
      enchanted_golden_apple: { material: ENCHANTED_GOLDEN_APPLE, amount: 1, price: 20, limit: 1 }
      totem_of_undying: { material: TOTEM_OF_UNDYING, amount: 1, price: 12, limit: 1 }
      elytra: { material: ELYTRA, amount: 1, price: 40, limit: 1 }
      shulker_shell: { material: SHULKER_SHELL, amount: 2, price: 8, limit: 2 }
      diamond_block: { material: DIAMOND_BLOCK, amount: 1, price: 12, limit: 2 }
      ancient_debris: { material: ANCIENT_DEBRIS, amount: 2, price: 10, limit: 2 }
      netherite_upgrade: { material: NETHERITE_UPGRADE_SMITHING_TEMPLATE, amount: 1, price: 10, limit: 1 }
      wither_skeleton_skull: { material: WITHER_SKELETON_SKULL, amount: 1, price: 8, limit: 3 }
      trident: { material: TRIDENT, amount: 1, price: 15, limit: 1 }
      heavy_core: { material: HEAVY_CORE, amount: 1, price: 25, limit: 1 }
      beacon: { material: BEACON, amount: 1, price: 50, limit: 1 }
      forge_totem: { material: forge_totem, amount: 1, price: 35, limit: 1 }

# ------------------------------------------------------------
#  HUD: sidebar, tab list and a title when you join
#  Placeholders: {tokens} {bounty} {legends_held} {event} {free_legends} {total_legends}
#  {online} {max_players} {rotation} {player}, {top_<category>_<n>_name} / {top_<category>_<n>_value} /
#  {top_<category>_rank}. With PlaceholderAPI the same exist as %forgebound_tokens% etc.
#  (for the TAB plugin, holograms...), and %other_plugin% placeholders work in these lines too.
#  Players can hide their own sidebar with /hud.
# ------------------------------------------------------------
hud:
  update-ticks: 40
  scoreboard:
    enabled: true
    # If the TAB plugin is installed, leave the sidebar to it (use %forgebound_...% there)
    disable-with-tab-plugin: true
    title: "&6&l⚒ FORGEBOUND"
    lines:
      - "&8&m              "
      - "&6Tokens: &f{tokens}"
      - "&cBounty: &f{bounty}"
      - " "
      - "&dLegends free: &f{free_legends}&7/&f{total_legends}"
      - "&eEvent: {event}"
      - "  "
      - "&7Shop rotates in &f{rotation}"
      - "&8&m               "
  tab:
    enabled: true
    disable-with-tab-plugin: true
    header:
      - ""
      - "&6&l⚒ FORGEBOUND ⚒"
      - "&7{online}/{max_players} online"
      - ""
    footer:
      - ""
      - "&7Event: {event}"
      - "&d{free_legends}&7/&d{total_legends} &7legends still unclaimed"
      - "&8/codex /shop /top /events"
      - ""
  join-title:
    enabled: true
    delay-ticks: 30
    title: "&6&l⚒ FORGEBOUND"
    subtitle: "&7Welcome back, &f{player}&7! &d{free_legends} &7legends still unclaimed"
    # For players joining for the first time
    first-title: "&6&lWelcome, &f{player}"
    first-subtitle: "&7Read the &6Forge Codex &7in your inventory"

# ------------------------------------------------------------
#  FORGE CODEX: a book that explains everything. New players get it once, /codex opens it.
#  Each page: & colors, \n = new line (about 14 lines of ~19 characters fit on a page).
# ------------------------------------------------------------
codex:
  enabled: true
  give-on-first-join: true
  title: "Forge Codex"
  author: "The Forge"
  item-name: "&6&lForge Codex"
  pages:
    - "&6&l   Forge Codex\n\n&0Every weapon and relic here is a &5legend&0: it exists only &lonce&r&0 on the whole server.\n\n&8Turn the page to learn how to get one."
    - "&6&lThe Forge\n\n&0Sneak + right-click a &lcrafting table&r&0 with an empty hand.\n\nPick a weapon or relic, bring the materials and start the &5ritual&0."
    - "&6&lThe Ritual\n\n&0Forging takes &l15 minutes&r&0. Everyone is told what is being forged, and the place is revealed step by step.\n\n&4Defend the table!&0 The legend drops on it at the end."
    - "&6&lMaterials\n\n&0Legendary materials drop from bosses and rare mobs, or hide in structure chests.\n\nMeteors, Rifts and the Forge Warden give them too."
    - "&6&lLegends\n\n&0F and Shift+F use a weapon's abilities.\n\n&e/legends&0 shows every legend and your stats.\n\nLeave the server for too long and your legend returns to the forge."
    - "&6&lStars\n\n&0Weapons have &6★&0 to &6★★★★★&0. More stars = more damage, shorter cooldowns.\n\nAncient Forges add them: Scorched Lands up to ★★, Nether ★★★, End ★★★★★ (it rises when the dragon dies).\n\n&4Die and you lose stars!"
    - "&6&lBounties\n\n&0Carrying a legend puts a price on your head. Whoever kills you gets &6Bounty Tokens&0.\n\n&e/bounty&0 shows the most wanted.\n&0The &lLegend Tracker&r&0 finds them."
    - "&6&lTokens\n\n&0Tokens are the server's money.\n\n&e/shop&0 always has something, and a new offer every week.\n&e/pay&0 sends tokens to a friend."
    - "&6&lEvents\n\n&4Blood Moon&0: tough nights.\n&5Rift&0: waves of monsters.\n&cLegend Hunt&0: a holder is hunted.\n&6Meteor&0, &eGolden Shipment&0, &aHappy Hour&0, &6Forge Market&0.\n\n&e/events&0 shows what's on."
    - "&6&lForge Warden\n\n&0Sneak + right-click a crafting table holding a &lNether Star&r&0 to wake the Warden.\n\nThe best fighter gets a &4Warden's Seal&0: any legendary material."
    - "&6&lEnchantments\n\n&5Forge Touch&0: pickaxes and shovels drop smelted ores.\n\n&5Bounty Hunter&0: more damage against players with a bounty.\n\n&0Both come from the enchanting table, librarians and loot."
    - "&6&lCommands\n\n&e/legends /bounty\n/shop /pay /events\n/top /hud /codex\n\n&0Good luck, and may your legend outlive you."

# ------------------------------------------------------------
#  LEADERBOARDS: /top <bounty|kills|mobkills|damage|wardens|rifts|hunts>
#  For holograms: %forgebound_top_kills_1_name% and %forgebound_top_kills_1_value% (PlaceholderAPI)
# ------------------------------------------------------------
top:
  enabled: true
  update-seconds: 60

# ------------------------------------------------------------
#  DOPPELGANGER
#  When someone stays top 1 on the bounty board for "hours-as-top-bounty" (offline time counts too),
#  "they" join the server: a glitched copy of that player in legendary gear that hunts them.
#  If it kills them, it takes one of their legends and keeps coming back with it (every
#  "return-minutes") until somebody kills it. The stolen legends are kept in ghost.yml, never lost.
#  Admins: /forge ghost [player|stop]
# ------------------------------------------------------------
doppelganger:
  enabled: true
  hours-as-top-bounty: 3
  # Bounty needed to count as top 1
  min-bounty: 5
  min-players: 1
  health: 600
  # Damage it takes is multiplied by this (lower = tankier)
  damage-taken-multiplier: 0.6
  attack-damage: 9
  # how close it has to be to hit you in melee (blocks, flat; a player reaches about 3)
  attack-reach: 2.0
  ability-damage: 6
  arrow-damage: 3
  ability-seconds: 5
  # walking speed in blocks per tick (0.22 = a walking player, 0.28 = sprinting): a slow tank you can outrun
  speed: 0.19
  # 0 = flies back like a player when hit, 1 = can't be pushed at all
  knockback-resistance: 0.0
  # how much further than a normal mob it flies back when you hit it (1 = normal)
  knockback-taken: 1.8
  # Below eat-below-percent health it backs off and eats a golden apple (1.6 s): heals and gives
  # absorption. golden-apples = how many it carries per visit.
  golden-apples: 3
  eat-below-percent: 40
  golden-apple-heal-percent: 12
  golden-apple-absorption-percent: 5
  golden-apple-cooldown: 8
  # It carries wind charges: jumps up to you, chases you when you run, or blows you away
  wind-charges: true
  wind-charge-seconds: 4
  # It digs through walls to get to you (no drops). Dug blocks are put back after dig-restore-seconds,
  # and all of them once it's gone, so nothing stays broken. Chests, furnaces, signs and other
  # block entities, doors, beds and unbreakable blocks are never dug, nor anything in dig-never.
  dig: true
  dig-time-multiplier: 1.0
  dig-restore-seconds: 60
  dig-never: [OBSIDIAN, CRYING_OBSIDIAN, RESPAWN_ANCHOR, DIAMOND_BLOCK, EMERALD_BLOCK, NETHERITE_BLOCK, GOLD_BLOCK, ANCIENT_DEBRIS, REINFORCED_DEEPSLATE, BUDDING_AMETHYST]
  # It only teleports when you're in another dimension or this far away (elytra, trident...)
  teleport-distance: 60
  # Wears an elytra instead of the chestplate and flies after you when you're far away. Strong!
  # Takes off with a wind charge and boosts with firework rockets (elytra-rockets per visit);
  # with no rockets left it only glides.
  elytra: false
  elytra-distance: 25
  elytra-rockets: 16
  elytra-speed: 1.6
  # It leaves after this long if nobody wins
  hunt-minutes: 30
  steal-legend: true
  max-stolen: 3
  return-minutes: 30
  reward-tokens: 25
  reward-material: true
  xp: 500
  # Armor trim on its netherite armor. Patterns: silence, eye, rib, ward, snout, spire, vex, wild, coast, dune,
  # sentry, tide, wayfinder, raiser, shaper, host, flow, bolt. Materials: quartz, iron, netherite, redstone,
  # copper, gold, emerald, diamond, lapis, amethyst, resin.
  trim:
    enabled: true
    pattern: silence
    material: quartz
  # What it says in chat now and then ({target} = whose copy it is)
  chat-lines:
    - "i can see you, {target}"
    - "why do you run, {target}"
    - "that legend was never yours"
    - "do you hear the forge? it remembers you"
    - "behind you"
    - "{target}. {target}. {target}."
    - "we are the same, {target}. only one of us stays"
    - "you made me"

# ------------------------------------------------------------
#  SEASON START: /forge season start (stand where the ceremony should be)
#  Countdown -> "Welcome to ..." -> effects around you -> a white beam into the sky ->
#  everyone is scattered across the SMP world. /forge season preview = the same without the teleport.
# ------------------------------------------------------------
season:
  # forge = anvil strikes, embers, every legend spinning above you and diving into a glowing beam
  # soul  = soul flames, a ring of crying obsidian and a white beam
  theme: forge
  countdown-seconds: 5
  countdown-color: "&6&l"
  countdown-subtitle: "&7The season begins..."
  title: "&6&lWelcome to FORGEBOUND SMP"
  subtitle: "&eSeason 1 has begun"
  chat: "&6&l⚒ &eWelcome to &6&lFORGEBOUND SMP&e! Season 1 has begun."
  # Floating text above the center (before / after the countdown)
  # ({legends} = how many legends there are, \n = new line)
  hologram-countdown: "&6The Forge Awakens..."
  hologram: "&6&lWelcome to FORGEBOUND SMP\n&e{legends} legends. One of each. &7Season 1"
  hologram-height: 4.5
  hologram-scale: 2.5
  # Particles over the whole area (forge: embers and sparks; soul: ambient-particle)
  ambient-particle: SOUL_FIRE_FLAME
  ambient-radius: 20
  ambient-amount: 12
  # The ring above you (forge: the legends themselves; soul: halo-blocks x halo-block)
  halo-block: CRYING_OBSIDIAN
  halo-blocks: 18
  halo-radius: 5
  # The glow around the beam's white core (forge: ORANGE_STAINED_GLASS, soul: WHITE_STAINED_GLASS)
  beam-glow-block: ORANGE_STAINED_GLASS
  # How long the beam shines before everyone is teleported
  beam-seconds: 5
  # A glowing rune circle draws itself on the ground (forge: glowing like hot metal, soul: pale blue), radius in blocks
  sigil: true
  sigil-radius: 9
  # A dark spiked crown turns above the center and at the end falls into the beam (soul: instead of the halo ring)
  crown: true
  crown-radius: 3.5
  crown-spikes: 12
  # Everything goes dark for a moment right before the beam lights up
  darkness: true
  # Ash (forge: and embers) drifts down while the beam shines
  ash: true
  # Players can't walk away during the ceremony
  freeze-players: true
  # You float up a little when it starts
  lift-host: true
  # Where everyone goes ("" = the main world): a random safe spot this far from the world spawn
  world: ""
  radius-min: 200
  radius-max: 1500
  # Players land at least this far from each other (if enough safe spots are found)
  min-distance-between-players: 100
  # Fall from the sky with slow falling (until they land) instead of landing on the ground
  drop-from-sky: true
  # After landing: resistance + fire resistance, and monsters ignore them, for this long (0 = off)
  protection-seconds: 15
  arrive-title: "&6&lGood luck"
  arrive-subtitle: "&7Forge your legend."

# ------------------------------------------------------------
#  LIVE MOTD (the server list)
#  line1 always stays. The second line shows what's happening right now, in this order:
#  Rift > Legend Hunt > Blood Moon > meteor > Forge Warden > a forge ritual > Happy Hour > Forge Market >
#  Golden Shipment > how many legends are still unclaimed.
#  enabled: false = the motd from server.properties is used instead.
# ------------------------------------------------------------
motd:
  enabled: true
  line1: "&6&l⚒ &e&lFORGEBOUND &6&l⚒ &8| &7Paper 1.21.11"
  rift-opening: "&5✷ A Rift is tearing the sky open..."
  rift: "&5✷ A Rift is open! &7Wave &d{wave}&7/&d{waves}"
  doppelganger: "&8&k|||&r &7Someone is hunting &f{player}&7... &8&k|||"
  legend-hunt: "&c☠ Legend Hunt! &f{player} &cis being hunted... &7{time} left"
  blood-moon: "&4☾ The Blood Moon has risen... &7({online} online)"
  meteor: "&6☄ A meteor is falling! &7Its cache is up for grabs."
  warden: "&4⚒ The Forge Warden is awake!"
  ritual: "&d⚒ Someone is forging {item}&d... &7{time} left"
  happy-hour: "&a✦ Happy Hour: &f{what}"
  forge-market: "&6⚖ The Forge Market is open! &7Special offers in /shop"
  golden-shipment: "&e✉ A Golden Shipment is waiting to be found!"
  idle: "&7Forge a &dlegend&7. &f{free}&7/&f{total} &7are still unclaimed."
  all-claimed: "&7Every legend has an owner. &cTake one from them."

# ------------------------------------------------------------
#  EVENTS (/events shows what's running; admins: /forge event <name|stop>)
#  Blood Moon: a chance every night. Rift: every few hours.
#  Small events (Happy Hour, Forge Market, Golden Shipment) come one at a time.
#  Meteors (see "meteor") wait while a Rift or Blood Moon is on.
# ------------------------------------------------------------
events:
  enabled: true
  # Players online needed for an event to start
  min-players: 3
  # World for the Blood Moon, Rift and Golden Shipment ("" = the main world)
  world: ""
  small-interval-minutes-min: 40
  small-interval-minutes-max: 80
  blood-moon:
    enabled: true
    # Chance (%) each night
    chance: 20
    health-multiplier: 1.5
    damage-multiplier: 1.3
    # Chance (%) a naturally spawned monster brings a friend
    extra-spawn-chance: 40
    # Chance (%) of a glowing "Blood-crazed" elite (more HP, 3x XP, Bounty Tokens)
    elite-chance: 8
    elite-tokens-min: 1
    elite-tokens-max: 2
    # Legendary material drop chances are multiplied by this all night
    loot-multiplier: 1.5
  rift:
    enabled: true
    interval-minutes-min: 90
    interval-minutes-max: 180
    # How far from a random player it opens
    distance-min: 150
    distance-max: 350
    warning-seconds: 180
    # It collapses after this long (or when nobody is near for 2 minutes)
    max-minutes: 25
    # Each wave: MOB:count,MOB:count. Counts grow by this much per extra player nearby.
    per-extra-player: 0.5
    waves:
      - "ZOMBIE:5,SKELETON:3"
      - "HUSK:4,STRAY:3,SPIDER:3"
      - "VINDICATOR:3,PILLAGER:3,WITCH:2"
      - "BLAZE:3,WITHER_SKELETON:4"
      - "RAVAGER:1,EVOKER:1,VINDICATOR:3"
    # Rewards, split by how much each player helped (damage + kills)
    token-pool: 15
    xp: 300
    min-share-percent: 5
    # Chance (%) the top player also gets a legendary material
    top-material-chance: 100
  # A random online legend holder is hunted: they glow, their area is revealed every few minutes and
  # their bounty counts double, but their abilities recharge faster. Survive = tokens.
  legend-hunt:
    enabled: true
    interval-minutes-min: 120
    interval-minutes-max: 240
    duration-minutes: 60
    reveal-minutes: 5
    reveal-radius: 100
    # The target's ability cooldowns are multiplied by this (0.5 = twice as fast)
    cooldown-multiplier: 0.5
    # The killer gets the bounty x this (the normal bounty + the extra), plus a bonus
    bounty-multiplier: 2
    kill-bonus-tokens: 5
    survive-tokens: 8
    # Logging out during the hunt adds this to the target's bounty
    flee-penalty-bounty: 5
  happy-hour:
    enabled: true
    weight: 1
    duration-minutes: 45
    multiplier: 2
    # Which kinds can happen
    types:
      xp: true
      loot: true
      ritual: true
  forge-market:
    enabled: true
    weight: 1
    duration-minutes: 30
    # How many of the offers below are in each market
    count: 4
    # Like the shop; "material" can also be legendary_material or legend_tracker. limit = per player per market.
    offers:
      legendary_material: { material: legendary_material, amount: 1, price: 3, limit: 1 }
      legend_tracker: { material: legend_tracker, amount: 1, price: 1, limit: 1 }
      netherite_ingot: { material: NETHERITE_INGOT, amount: 1, price: 12, limit: 1 }
      diamonds: { material: DIAMOND, amount: 4, price: 4, limit: 2 }
      enchanted_golden_apple: { material: ENCHANTED_GOLDEN_APPLE, amount: 1, price: 12, limit: 1 }
      totem_of_undying: { material: TOTEM_OF_UNDYING, amount: 1, price: 8, limit: 1 }
      trial_key: { material: OMINOUS_TRIAL_KEY, amount: 1, price: 6, limit: 1 }
  golden-shipment:
    enabled: true
    weight: 1
    # Lands up to this far from spawn; the hint is an area of ±area-radius blocks
    radius: 1500
    area-radius: 150
    # Disappears if nobody finds it in time
    despawn-minutes: 20
    tokens-min: 1
    tokens-max: 3
    # Chance (%) of a legendary material inside
    material-chance: 15

# ------------------------------------------------------------
#  DIALOGS
# ------------------------------------------------------------
# Real windows (1.21.6+ clients) instead of chat hints. false = the old behaviour.
dialogs:
  enabled: true
  # /shop: confirm purchases that cost at least this many tokens
  shop-confirm: true
  shop-confirm-from: 5
  # /pay without arguments opens a window (player + amount)
  pay: true
  # /pay of at least this many tokens asks first
  pay-confirm: true
  pay-confirm-from: 10
  # /forge season without arguments: theme + start / preview / cancel
  season-panel: true
  # /forge release asks first (shows who owns the legend)
  release-confirm: true

# ------------------------------------------------------------
#  ENCHANTMENTS
# ------------------------------------------------------------
# Forgebound's own enchantments. They always exist (items that have them stay valid); these switches decide
# what they do and where they can be found. enchanting-table / villagers / loot need a server restart.
enchantments:
  forge-touch:
    # pickaxes, shovels, axes, hoes: mined blocks drop already smelted (can't be combined with Silk Touch)
    enabled: true
    enchanting-table: true
    villagers: true
    loot: true
    # furnace XP for what was smelted
    xp: true
    # drops that stay as they are (exact names or wildcards like "*_log")
    skip: ["*_log", "*_wood", "*_stem", "*_hyphae"]
  bounty-hunter:
    # anything that takes Sharpness: +damage against players with a bounty (I-III)
    enabled: true
    enchanting-table: true
    villagers: true
    loot: true
    damage-per-level: 0.08

# ------------------------------------------------------------
#  ITEMS
# ------------------------------------------------------------
items:
  # legendary weapons and relics float in lava and don't burn (like netherite)
  fireproof-legends: true

# ------------------------------------------------------------
#  SCORCHED LANDS
#  A rare burnt biome (forgebound:scorched_lands): ash in the air, grey-orange sky, coarse dirt, gravel and
#  blackstone, trees burnt to stumps. Ruins generate in it: ruined forges, burnt workshops, slag heaps and
#  watchtowers, with loot chests (and Bounty Tokens / rarely a legendary material) and husk guards.
#  ONLY NEW CHUNKS: land that's already generated is never changed. /forge scorched = where's the nearest one.
#  Changes to rarity / zone-size only affect chunks generated afterwards (keep them once the world is played).
# ------------------------------------------------------------
scorched-lands:
  enabled: true
  # worlds to generate in; empty = every overworld
  worlds: []
  # share of the world that's scorched (0.03 = 3 %, about as rare as badlands)
  rarity: 0.03
  # bigger = larger but fewer areas (800 = areas about 200 blocks across)
  zone-size: 800
  ruins: true
  # chance of a ruin in every 4x4-chunk area deep inside the biome
  ruin-chance: 0.35
  guards: true
  # areas that are ALWAYS there (from the seed), so they're inside your world border. Placed between min- and
  # max-distance from center-x/z. count: 0 = only the random ones. forges: how many of them get an Ancient Forge
  # in the middle.
  guaranteed:
    count: 2
    forges: 1
    min-distance: 500
    max-distance: 1700
    radius: 110
    center-x: 0
    center-z: 0
  loot:
    # % chance that a ruin chest also has Bounty Tokens
    token-chance: 25
    tokens-min: 1
    tokens-max: 3
    # % chance of a random legendary material in the big forge chest
    material-chance: 3

# ------------------------------------------------------------
#  STARS - legend weapons have 1 to 5 stars (kept in half steps)
#  A freshly forged weapon has ★. Every star above or below ★★★ changes ALL its damage (hits, arrows,
#  abilities) and its ability cooldowns by percent-per-star: ★ = -15 %, ★★★ = as before, ★★★★★ = +15 %.
#  Weapons forged before stars existed start with legacy-stars.
#  Stars are earned only at an Ancient Forge (see ancient-forge) and lost when you die.
# ------------------------------------------------------------
stars:
  enabled: true
  percent-per-star: 7.5
  new-stars: 1
  legacy-stars: 3
  # every legend weapon you carry loses this many stars when you die (never below ★)
  lose-on-player-kill: 2
  lose-on-other-death: 0.5
  # what the ritual costs, by the star it reaches (2 = ★★ ... 5 = ★★★★★; from a half star it goes one star up).
  # items: like forge recipes (max 5); "material:own" = the weapon's own legendary material
  costs:
    2:
      minutes: 10
      tokens: 2
      items:
        - { item: GOLD_BLOCK, amount: 8 }
        - { item: DIAMOND, amount: 8 }
    3:
      minutes: 20
      tokens: 4
      items:
        - { item: DIAMOND_BLOCK, amount: 4 }
        - { item: NETHERITE_SCRAP, amount: 4 }
        - { item: BLAZE_ROD, amount: 16 }
    4:
      minutes: 40
      tokens: 8
      items:
        - { item: DIAMOND_BLOCK, amount: 8 }
        - { item: NETHERITE_INGOT, amount: 2 }
        - { item: "material:own", amount: 1 }
    5:
      minutes: 60
      tokens: 12
      items:
        - { item: NETHERITE_INGOT, amount: 4 }
        - { item: NETHER_STAR, amount: 1 }
        - { item: "material:own", amount: 1 }

# ------------------------------------------------------------
#  ANCIENT FORGE - the only place where weapons get stars
#  Three forges, each stronger than the last: one in the Scorched Lands (up to ★★), one in the Nether (up to ★★★)
#  - both generate in NEW chunks, see the guaranteed settings - and one in the End (up to ★★★★★), which rises
#  out of the void on a floating island when the dragon dies for the first time.
#  Use the anvil in the middle holding a legend weapon. The weapon stays in the forge during the ritual
#  and drops there when it ends - whoever is there can take it. A pillar of soul fire above the forge
#  shows where it is from far away (smoke while it cools down).
#  /forge ancient (list, tp) - /forge ancient here (build one) - /forge ancient end (raise the End forge now)
#  /forge stars <player> <1-5>
# ------------------------------------------------------------
ancient-forge:
  # the most stars each forge can give
  max-stars:
    overworld: 2
    nether: 3
    end: 5
  end:
    enabled: true
    # how far from the exit portal the island floats, and at what height
    distance: 110
    height: 70
  # By default there is exactly ONE Ancient Forge per dimension: the guaranteed one (scorched-lands.guaranteed.forges
  # and nether-guaranteed below). These chances add random extra ones (0 = none):
  # chance that a ruin spot deep in the Scorched Lands gets an Ancient Forge instead of a ruin
  scorched-chance: 0
  nether: true
  # one possible forge per this many chunks in each direction (16 = 256 blocks), and the chance it's there
  nether-cell-chunks: 16
  nether-chance: 0
  # Nether forges that are ALWAYS there (from the seed), between min- and max-distance from the nether center
  # (scorched-lands.guaranteed.center / 8). Keep max-distance inside the Nether border.
  nether-guaranteed:
    count: 1
    min-distance: 60
    max-distance: 220
  # after a ritual the forge cools down this long (real hours, also while the server is off)
  cooldown-hours: 24

# ------------------------------------------------------------
#  AUTO-UPDATE
#  Every few hours the plugin looks for a newer release on GitHub. A newer Forgebound.jar is downloaded into
#  plugins/update/ and Paper swaps it in on the next restart (nothing changes while the server runs).
#  resource-pack: also puts that release's pack link and SHA1 into server.properties, so the new plugin and
#  the new pack switch over together at the restart. Only if the resource-pack line already points to
#  this repository (your own pack is left alone).
# ------------------------------------------------------------
auto-update:
  enabled: true
  # false = only tell the admins that a new version is out
  download: true
  resource-pack: true
  # how often to look for a new version (it asks the GitHub release page, which has no limit)
  check-hours: 1
  # where the releases are published
  repo: "Freonik/Forgebound-releases"
  # nightly update restart: at this time Forgebound, Forgebound Guard and Forgebound Teams all check for a new version
  # at once; if any downloaded one, players get a countdown and the server restarts once for all of them.
  # ONLY turn this on if something starts the server again after it stops: e.g. a daily "start" in your host's
  # planner a few minutes after the restart (set host-start to that time), or a host that restarts it by itself.
  # Otherwise the server would stay off until someone starts it.
  # /forge update restart = check now and restart (even without a new version), /forge update cancel = stop the countdown
  restart:
    enabled: false
    # when your host's planner starts the server; the restart has to be done before it (else it waits for tomorrow)
    host-start: "04:15"
    time: "04:00"
    timezone: "Europe/Prague"
    # minutes of warning for the players (bossbar + chat)
    warn-minutes: 10
    # restart = spigot.yml restart-script (falls back to a stop), stop = just stop (the host starts it again)
    method: restart

# ------------------------------------------------------------
#  TEAMS
#  Teammates = same vanilla team (/team), or the same value of a PlaceholderAPI placeholder from
#  your team/clan plugin (e.g. "%betterteams_name%", "%simpleclans_clan_tag%"). Both can be on.
#  Teammates: abilities don't hurt them, Devour hides them inside you, Recon spots are shared
#  with them, no bounty for killing them, the Legend Tracker skips them.
# ------------------------------------------------------------
teams:
  enabled: true
  vanilla: true
  # "" = only vanilla teams
  placeholder: ""
  # Placeholder values that mean "no team"
  no-team-values: ["", "none", "-", "No team", "null"]
  # Abilities also hit teammates
  friendly-fire: false
  # Teammates see what you spot with the Recon Spyglass
  share-spots: true
  # Killing a teammate pays out their bounty
  bounty-on-teammates: false

# ------------------------------------------------------------
#  BIG EVENTS - only started by an admin, planned ahead:
#    /forge bigevent plan <border|hunt|boss> <20:00 | 25.10 20:00 | +2h>   (the boss rises where you stand)
#    /forge bigevent start <type>   /forge bigevent list   /forge bigevent cancel <id>   /forge bigevent stop
#  Everyone is told a day, an hour, 10 minutes and a minute before; the last 10 minutes count down in a bar.
#  The winner gets a MYTHIC weapon (see the weapons section) that fades after mythic-days.
#  Prizes for players who are offline when an event ends wait until they join.
#  border: The Closing World - the world border shrinks around center; whoever leaves the world, logs out or
#          dies is out. The last one standing wins (more left at the end: most kills). The border goes back after.
#  hunt:   The Hunt - everyone shows on the locator bar; the most player kills wins (the same victim counts
#          again only after same-victim-minutes).
#  boss:   The Forge Colossus - a world boss; only players can hurt it. The most damage wins.
# ------------------------------------------------------------
big-events:
  timezone: "Europe/Prague"
  announce-minutes: [1440, 60, 10, 1]
  min-players: 2
  mythic-days: 7
  border:
    center: [0, 0]
    start-size: 2000
    final-size: 100
    shrink-minutes: 25
    final-minutes: 5
    damage-per-block: 1.0
    winner-tokens: 10
    winner-totems: 1
    player-tokens: 2
    mythic: worldsplitter
  hunt:
    minutes: 30
    same-victim-minutes: 5
    top-tokens: [10, 6, 4]
    top-totems: [1, 0, 0]
    player-tokens: 1
    mythic: bloodfang
  boss:
    name: "&4&lThe Forge Colossus"
    health: 800
    health-per-player: 200
    damage: 14
    slam-damage: 8
    scale: 2.5
    minutes: 30
    xp: 1500
    top-tokens: [12, 8, 5]
    top-totems: [1, 1, 1]
    # everyone else with at least 2% of the damage
    player-tokens: 3
    material-chance: 30
    mythic: titans_echo

# ------------------------------------------------------------
#  QUESTS - the Questmaster (an NPC): /forge npc set puts it where you stand, /forge npc remove.
#  Every day daily-count quests from "daily", every week (from Monday) weekly-count from "weekly" - the same for
#  everybody. Progress counts anywhere (/quests shows it), the reward is claimed at the Questmaster.
#  type: KILL (target: entity types or ANY_MONSTER), KILL_PLAYER (each victim once), MINE (target: blocks or a
#  #block_tag like #logs; blocks you placed don't count), FISH, TRAVEL (blocks on foot), DELIVER (target: item;
#  handed over at the NPC). Rewards: tokens (Bounty Tokens), materials (random legendary materials), xp,
#  totems (Totems of the Forge).
#  icon: optional item shown in the menu. enabled: false takes a quest out of the pool.
# ------------------------------------------------------------
quests:
  enabled: true
  npc-name: "&6&lQuestmaster"
  daily-count: 3
  weekly-count: 1
  # bonus for finishing all daily quests of a day
  all-daily-bonus-tokens: 2
  daily:
    zombies: { type: KILL, target: "ZOMBIE,HUSK,DROWNED,ZOMBIE_VILLAGER", amount: 80, name: "Kill 80 zombies", tokens: 1, xp: 150 }
    skeletons: { type: KILL, target: "SKELETON,STRAY,BOGGED", amount: 60, name: "Kill 60 skeletons", tokens: 1, xp: 150 }
    creepers: { type: KILL, target: CREEPER, amount: 40, name: "Kill 40 creepers", tokens: 1, xp: 150 }
    endermen: { type: KILL, target: ENDERMAN, amount: 30, name: "Kill 30 endermen", tokens: 2 }
    blazes: { type: KILL, target: BLAZE, amount: 40, name: "Kill 40 blazes", tokens: 2 }
    monsters: { type: KILL, target: ANY_MONSTER, amount: 200, name: "Kill 200 monsters", tokens: 2 }
    diamonds: { type: MINE, target: "DIAMOND_ORE,DEEPSLATE_DIAMOND_ORE", amount: 24, name: "Mine 24 diamond ores", tokens: 2, icon: DIAMOND }
    iron: { type: MINE, target: "IRON_ORE,DEEPSLATE_IRON_ORE", amount: 96, name: "Mine 96 iron ores", tokens: 1, icon: RAW_IRON }
    logs: { type: MINE, target: "#logs", amount: 384, name: "Chop 384 logs", tokens: 1, icon: OAK_LOG }
    stone: { type: MINE, target: "STONE,DEEPSLATE,COBBLESTONE,TUFF", amount: 2048, name: "Mine 2048 stone", tokens: 1, icon: STONE_PICKAXE }
    fishing: { type: FISH, amount: 30, name: "Catch 30 fish", tokens: 1, xp: 200 }
    travel: { type: TRAVEL, amount: 10000, name: "Travel 10000 blocks on foot", tokens: 1 }
    wheat: { type: DELIVER, target: WHEAT, amount: 256, name: "Bring 256 wheat", tokens: 1, icon: WHEAT }
    gold: { type: DELIVER, target: GOLD_INGOT, amount: 128, name: "Bring 128 gold ingots", tokens: 2, icon: GOLD_INGOT }
    pvp: { type: KILL_PLAYER, amount: 3, name: "Kill 3 players", tokens: 2 }
  # weekly quests are meant to take real effort; only the hardest ones give a legendary material
  weekly:
    debris: { type: MINE, target: ANCIENT_DEBRIS, amount: 48, name: "Mine 48 ancient debris", tokens: 6, materials: 1, icon: ANCIENT_DEBRIS }
    hunter: { type: KILL_PLAYER, amount: 10, name: "Kill 10 different players", tokens: 6, materials: 1, totems: 1 }
    slayer: { type: KILL, target: ANY_MONSTER, amount: 1500, name: "Kill 1500 monsters", tokens: 6 }
    diamonds: { type: DELIVER, target: DIAMOND, amount: 128, name: "Bring 128 diamonds", tokens: 6 }
    explorer: { type: TRAVEL, amount: 100000, name: "Travel 100000 blocks on foot", tokens: 5 }
    wither: { type: KILL, target: WITHER, amount: 3, name: "Kill the Wither 3 times", tokens: 6, materials: 1, totems: 1, icon: WITHER_SKELETON_SKULL }
    guardians: { type: KILL, target: "GUARDIAN,ELDER_GUARDIAN", amount: 150, name: "Kill 150 guardians", tokens: 5, icon: PRISMARINE_SHARD }

# ------------------------------------------------------------
#  TOTEM OF THE FORGE - a totem of undying that also works from anywhere in the inventory (held in a hand it
#  works like any totem). Back at full health, a few seconds untouchable, absorption, and a burst of fire that
#  throws everyone around you back. From big events, weekly quests and the token shop (rotating offer).
#  Angel's Wings save you first if they're ready. /forge totem gives you one.
# ------------------------------------------------------------
forge-totem:
  enabled: true
  invulnerable-seconds: 3
  absorption-level: 4
  absorption-seconds: 10
  burst-radius: 5
  burst-damage: 4
  burst-knockback: 1.4

# ------------------------------------------------------------
#  CUSTOM ENCHANTMENTS
#  Locked until a third of the legends are forged, then only a few copies of each per season.
#  Only from Sealed Tomes: rare finds in structure chests and trial vaults (never in the enchanting table,
#  on villagers or in vanilla loot). Right-click a tome with enough levels to open it: you get an enchanted book
#  with a random enchantment of the tome's rarity (lower levels are more common). Apply it with an anvil.
#  Legendary weapons and relics can't take them, and the weapon ones (Lifesteal, Bleed, Execute, Cripple) only work
#  on mobs and on players who carry a legend - they help hunt the legends, never replace them.
#  Common: Cripple, Wisdom, Implants, Springs, Telepathy
#  Rare: Bleed, Execute, Dodge, Grounded, Cleanse, Vein Miner
#  Legendary: Lifesteal, Overload, Warding
#  The enchantments are registered at startup (a restart is needed after an update).
# ------------------------------------------------------------
custom-enchants:
  # off = never, on = always, unlock = they wake up for the whole server (with a ceremony) once players have forged
  # unlock-fraction of the legends (admin gifts don't count). /forge enchants [status|unlock|lock|reset]
  mode: unlock
  unlock-fraction: 0.334
  # how many times each enchantment can come out of a tome per season (/forge enchants reset = new season)
  copies:
    common: 8
    rare: 4
    legendary: 2
  open-levels:
    common: 10
    rare: 20
    legendary: 30
  # false = a tome never gives it (it stays on items that already have it)
  list:
    lifesteal: true
    bleed: true
    execute: true
    cripple: true
    wisdom: true
    overload: true
    dodge: true
    implants: true
    springs: true
    warding: true
    grounded: true
    cleanse: true
    telepathy: true
    vein_miner: true
  # chance in % per chest that it has a tome (the rarest that hits; at most one)
  loot:
    ancient-city: { table: "minecraft:chests/ancient_city", common: 1, rare: 0.4, legendary: 0.13 }
    end-city: { table: "minecraft:chests/end_city_treasure", common: 1, rare: 0.4, legendary: 0.13 }
    bastion: { table: "minecraft:chests/bastion_treasure", common: 1, rare: 0.4, legendary: 0.13 }
    ominous-vault: { table: "minecraft:chests/trial_chambers/reward_ominous", common: 1, rare: 0.5, legendary: 0.17 }
    vault: { table: "minecraft:chests/trial_chambers/reward", common: 0.5, rare: 0.17, legendary: 0.03 }
    stronghold-library: { table: "minecraft:chests/stronghold_library", common: 1, rare: 0.33, legendary: 0.1 }
    mansion: { table: "minecraft:chests/woodland_mansion", common: 0.67, rare: 0.27, legendary: 0.07 }
    buried-treasure: { table: "minecraft:chests/buried_treasure", common: 0.67, rare: 0.2, legendary: 0.05 }
    desert-pyramid: { table: "minecraft:chests/desert_pyramid", common: 0.33, rare: 0.1, legendary: 0.02 }
    jungle-temple: { table: "minecraft:chests/jungle_temple", common: 0.33, rare: 0.1, legendary: 0.02 }
    dungeon: { table: "minecraft:chests/simple_dungeon", common: 0.33, rare: 0.1, legendary: 0.02 }
    forge-ruin: { table: "forgebound:chests/forge_ruin", common: 0.67, rare: 0.27, legendary: 0.07 }

# ------------------------------------------------------------
#  PROTECTION
#  Spawn (the Forge Citadel from /forge spawnbuild) and every Ancient Forge: blocks can be mined and blown up,
#  but nothing drops, and after regen-minutes they come back (blocks placed there disappear again).
#  It never puts a block back inside someone or pulls one away from under someone. Admins in creative build freely.
# ------------------------------------------------------------
protection:
  enabled: true
  spawn: true
  ancient-forges: true
  regen-minutes: 25
  # how far around an Ancient Forge's anvil (blocks)
  forge-radius: 15

# ------------------------------------------------------------
#  COMBAT
#  Hit a player (or get hit) and you are in combat for tag-seconds (a red bar shows how long).
#  Logging out in combat kills you: your items drop and the last attacker gets the kill (bounty, stars...).
#  Kicks and server restarts don't count. Teammates and creative/spectator players don't tag.
#  Clash of legends: kill a player who carries a legend weapon while you hold one and your weapon
#  gets stars (never above max-stars - the last stars only come from the Ancient Forges).
#  The same victim gives it again only after same-victim-minutes.
# ------------------------------------------------------------
combat:
  enabled: true
  tag-seconds: 20
  kill-on-logout: true
  bossbar: true
  # no flying away with an elytra while in combat
  disable-elytra: true
  # commands that can't be used in combat (e.g. [tpa, home, spawn, warp, rtp]); admins can use them
  blocked-commands: []
  # vanilla maces can't be crafted (Knightfall is forged without one)
  disable-mace-crafting: true
  # after a mace smash (a hit while falling) the next smash only deals normal damage for this long (seconds, 0 = off)
  mace-smash-cooldown: 10
  # villagers never sell Mending (a Mending book becomes another enchanted book for the same price)
  no-villager-mending: true
  duel:
    enabled: true
    stars: 0.5
    max-stars: 4
    same-victim-minutes: 60

# ------------------------------------------------------------
#  RECON SPYGLASS (in /shop)
#  Hold a player in sight through it for aim-seconds and you see their red outline through walls
#  and a marker with name + distance - only you. The spotted player only hears a quiet click.
# ------------------------------------------------------------
recon:
  enabled: true
  range: 150
  aim-seconds: 0.75
  seconds: 10
  # Longer for players with a bounty / the Legend Hunt target
  seconds-bounty: 15
  seconds-hunted: 20
  cooldown-seconds: 30
  # Uses before it breaks
  charges: 20
  # The spotted player hears a quiet click and sees an eye (no name)
  hint-target: true
  # Someone else kills a player you spotted (while spotted or up to assist-window-seconds after):
  # you get assist-tokens + assist-bounty-percent of their bounty (on top, the killer still gets it all)
  assist-window-seconds: 10
  assist-tokens: 1
  assist-bounty-percent: 25

# ------------------------------------------------------------
#  METEOR
#  Every few hours a meteor falls somewhere within "radius" blocks of spawn.
#  Its location is revealed step by step; it carries a Meteor Cache with a legendary
#  material. Admins: /forge meteor
# ------------------------------------------------------------
meteor:
  enabled: true
  interval-minutes-min: 120
  interval-minutes-max: 240
  min-players: 3
  # World name ("" = the main world)
  world: ""
  radius: 2500
  # How long before impact it is announced, and the size of the hinted area
  warning-seconds: 300
  area-radius: 300
  # Chance (%) the cache contains a Legend Tracker / that the Forge Warden guards the crash site
  tracker-chance: 25
  warden-chance: 25

# ------------------------------------------------------------
#  FORGE WARDEN
#  A boss. Sneak + right-click a crafting table holding the summon item.
#  The top damage dealer gets a Warden's Seal (choose any legendary material).
#  Admins: /forge warden
# ------------------------------------------------------------
warden:
  enabled: true
  summon-item: NETHER_STAR
  summon-amount: 1
  health: 500
  scale: 1.8
  attack-damage: 14
  slam-damage: 10
  fire-damage: 4
  xp: 1000

# Forgebound advancement tab (toasts, chat messages, XP for challenges)
advancements:
  enabled: true

# Small visual effects for worn relics (wing feathers at the ankles, heartbeat, spores)
relic-settings:
  particles: true
  # set relics (relic.set): each worn piece gives this share of the effect, all four pieces together set-full
  set-piece: 0.25
  set-full: 1.25

# ------------------------------------------------------------
#  RELICS - armor and off-hand items with a special effect
#  They are forged with a ritual and unique, just like weapons.
#  A relic only works in its own slot ("relic.slot"): OFFHAND, HEAD, CHEST, LEGS or FEET,
#  so you can wear one chestplate relic, one boots relic and hold one off-hand relic.
#  (Thorn Plate and Heartsteel are both chestplates - pick one.)
#  SETS: "relic.set" makes a relic one piece of a 4-piece set (helmet, chestplate, leggings, boots).
#  Each piece gives 1/4 of the set's effect, all four together 5/4 (relic-settings.set-piece / set-full).
#  The numbers in a set relic's section are the FULL effect (before the 1/4 or 5/4).
#  A set can have several effects (Pale Seraph: Soul Vessel + Angel's Wings) - every piece adds to all of them.
#  Angel's Wings in a set: the cooldown is divided instead (1 piece = 4x longer, full set = 0.8x).
#
#  relic.type: STASIS, REVIVE, THORNS, HEARTSTEEL, THICK_HIDE, SOUL_VESSEL, STITCHGUARD,
#              SET (a set piece without an effect of its own: it adds to the effects of its set)
#  attributes: stats that only count in the relic's slot (armor, armor_toughness,
#              knockback_resistance, max_health, movement_speed, ...)
#  equipment-model: how the armor looks when worn (from the resource pack)
#  Cooldowns and Heartsteel stacks are stored on the item itself.
#  Relics and weapons can't be used in a smithing table (no trims / upgrades).
# ------------------------------------------------------------
relics:
  stasis_hourglass:
    material: CLOCK
    name: "&6&lStasis Hourglass"
    lore:
      - "&7Time stops for whoever holds it."
    custom-model-data: 1201
    relic:
      type: STASIS
      slot: OFFHAND
      cooldown: 120
      duration: 2.5
      description: ["Right-click: turn into a golden statue", "for 2.5s. You can't be hurt, but you", "can't move or attack either."]
    forge:
      - { item: CLOCK, amount: 4 }
      - { item: GOLD_BLOCK, amount: 16 }
      - { item: AMETHYST_SHARD, amount: 32 }
      - { item: "material:chrono_sand", amount: 1 }

  angels_wings:
    material: NETHERITE_BOOTS
    name: "&f&lAngel's Wings"
    lore:
      - "&7Light as a feather, stubborn as a saint."
    custom-model-data: 1202
    unbreakable: true
    equipment-model: "customcraft:pale_seraph"
    attributes:
      armor: 3
      armor_toughness: 3
      knockback_resistance: 0.1
    relic:
      type: REVIVE
      slot: FEET
      set: pale_seraph
      cooldown: 600
      heal-percent: 50
      protection-seconds: 3
      fall-reduction: 50
      description: ["Pale Seraph set: when you would die, come", "back with 50% HP and 3s of protection", "(every 10 min with the full set; fewer", "pieces = longer). Less fall damage."]
    forge:
      - { item: NETHERITE_BOOTS, amount: 1 }
      - { item: TOTEM_OF_UNDYING, amount: 2 }
      - { item: PHANTOM_MEMBRANE, amount: 32 }
      - { item: FEATHER, amount: 64 }
      - { item: "material:seraph_feather", amount: 1 }

  thorn_plate:
    material: NETHERITE_CHESTPLATE
    name: "&2&lThorn Plate"
    lore:
      - "&7Every blow has a price."
    custom-model-data: 1203
    unbreakable: true
    equipment-model: "customcraft:thorn_plate"
    attributes:
      armor: 8
      armor_toughness: 3
      knockback_resistance: 0.1
    relic:
      type: THORNS
      slot: CHEST
      set: thorn
      reflect-flat: 2
      reflect-percent: 25
      wound-seconds: 3
      heal-reduction: 100
      description: ["Thorn set: reflects 2 + 25% of melee", "damage (half vs. arrows). Attackers get", "Grievous Wounds: no healing for 3s."]
    forge:
      - { item: NETHERITE_CHESTPLATE, amount: 1 }
      - { item: CACTUS, amount: 64 }
