# ------------------------------------------------------------
#  LEGENDARY MATERIALS
#  Every weapon and relic needs one of these in its forge recipe.
#  They drop from bosses and rare mobs (only when a PLAYER kills them, so farms
#  don't work) and are sometimes found in structure chests and trial vaults.
#  Mob drops fall on the ground where the mob died (glowing, can't burn or despawn).
#  The materials can't be placed, eaten, traded, brewed or used in vanilla crafting.
#
#  drops:
#    - { mob: WARDEN, chance: 35 }                       # % per kill
#    - { mob: PHANTOM, chance: 2, min-y: 200 }           # only above Y 200
#    - { mob: WITHER_SKELETON, chance: 2, biomes: [soul_sand_valley] }
#    - { loot-table: chests/ancient_city, chance: 3 }    # structure chest / trial vault
#    broadcast: false   -> only the finder gets a message
# ------------------------------------------------------------
loot-settings:
  # Hard cap for every drop chance (legendary = never guaranteed)
  max-chance: 45
  # Each Looting level raises a mob drop chance by this many % of itself (Looting III = +60%)
  looting-bonus-percent: 20
  broadcast: true
  # The Ender Dragon's drop spirals down onto the exit portal pillar over this many seconds
  dragon-descent-seconds: 10

